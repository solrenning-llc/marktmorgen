name: AX2 real screen reader entry pilot
run-name: PV8 source ${{ github.sha }}
on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
  actions: read
concurrency:
  group: ax2-real-reader-${{ github.ref }}-${{ github.event_name }}
  # A merge group's ref is its own (gh-readonly-queue/main/pr-N-…), so with the event in
  # the group a merge group never shares one with a pull request run or another merge group.
  # The active merge-group run is never canceled by this group; a newer delivery of the same
  # merge group may replace one still pending, and that replacement is the same check.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
jobs:
  documentation-scope:
    name: Documentation scope (accessibility-real-readers)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test conservative documentation classification
        run: |
          python3 scripts/test_ci_documentation_scope.py
          python3 scripts/test_ci_full_tree_proof.py
      # Documentation-only allowlist (scripts/ci_documentation_scope.py documentation_path): regular,
      # non-executable *.md files at the top level or under docs/, never AGENTS.md or SKILL.md, never in
      # a hidden, tests/, scripts/, tooling/ or node_modules/ folder. Anything else (code, tests,
      # configuration, workflows, package files, JSON, images, a rename, a symlink, an executable bit,
      # an empty or unreadable diff) runs every job exactly as before. pull_request: the PR's diff;
      # merge_group: the queue entry against its first parent, only under ALLGREEN; push to main: the
      # previous head, only when that head is green for this workflow (never for CodeQL).
      - name: Compare the actual change; uncertainty keeps full coverage
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_TOKEN: ${{ github.token }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
          CI_BEFORE: ${{ github.event.before }}
          CI_SHA: ${{ github.sha }}
        run: python3 scripts/ci_documentation_scope.py
  entry-pilot:
    needs: documentation-scope
    # Fail closed before runner allocation; never use larger or self-hosted runners.
    if: ${{ !cancelled() && needs.documentation-scope.outputs.full != 'false' && (github.repository_id == '1334793724' || github.repository == 'viniciussucupira/marktmorgen') && github.event.repository.private == false && github.event.repository.visibility == 'public' }}
    name: Real reader entry (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [windows-latest, macos-latest]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AX2_PUBLIC_DISPOSABLE_RUNNER: "true"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: node scripts/ci-build.mjs
      - name: Install isolated locked tooling without lifecycle scripts or optional recording
        working-directory: tooling/screen-reader
        run: npm ci --ignore-scripts --omit=optional --no-fund
      - name: Audit isolated tooling
        working-directory: tooling/screen-reader
        run: npm audit --omit=optional --audit-level=moderate
      - name: Install matching headed browser
        run: node node_modules/playwright-core/cli.js install ${{ runner.os == 'Windows' && 'chromium' || 'webkit' }}
      - name: Check owned preparation recovery and refusal cases
        working-directory: tooling/screen-reader
        run: node --test owned-repository.test.mjs setup-owned-reader.test.mjs navigate-to-content.test.mjs windows-foreground.test.mjs
      - name: Configure real screen reader on disposable standard runner
        working-directory: tooling/screen-reader
        run: node setup-owned-reader.mjs
      - name: Install version-matched real reader assets
        working-directory: tooling/screen-reader
        run: node node_modules/@guidepup/setup/bin/guidepup install
      - name: Check bounded reader preflight ownership and refusal cases
        working-directory: tooling/screen-reader
        run: node --test reset-voiceover.test.mjs
      - name: Assert actual entry heading announcements and log exact speech
        working-directory: tooling/screen-reader
        run: node entry-pilot.mjs

  all-checks:
    # The one check GitHub requires before main (scripts/ci_all_checks.py): it always runs and
    # passes only when every job above passed, or was skipped for a documentation-only change.
    name: All checks (accessibility-real-readers)
    needs: [documentation-scope, entry-pilot]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read every job's result; a skip counts only when the scope proved it unneeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 scripts/test_ci_all_checks.py
          python3 scripts/ci_all_checks.py
