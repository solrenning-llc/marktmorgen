name: Studio accessibility matrix
run-name: PV8 source ${{ github.sha }}
on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
  actions: read
concurrency:
  group: studio-accessibility-${{ github.ref }}-${{ github.event_name }}
  # A merge group's ref is its own (gh-readonly-queue/main/pr-N-…), so with the event in
  # the group a merge group never shares one with a pull request run or another merge group.
  # The active merge-group run is never canceled by this group; a newer delivery of the same
  # merge group may replace one still pending, and that replacement is the same check.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
jobs:
  documentation-scope:
    name: Documentation scope (accessibility-studio-matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test conservative documentation classification
        run: |
          python3 scripts/test_ci_documentation_scope.py
          python3 scripts/test_ci_full_tree_proof.py
      - name: Compare actual PR trees; uncertainty keeps full coverage
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_TOKEN: ${{ github.token }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_documentation_scope.py
  build:
    needs: documentation-scope
    if: ${{ !cancelled() && needs.documentation-scope.outputs.full != 'false' }}
    # The production build, once per run instead of once in every browser job. The jobs that
    # start it download this one; scripts/ci-next-artifact.mjs refuses a build of another tree,
    # Node major, platform or architecture. Same image, user and Node as those jobs.
    name: Next build (accessibility-studio-matrix)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --init --ipc=host --user pwuser
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # TypeScript's incremental record of the build of this tree's base commit (its first parent:
      # main for a pull request or a merge group, the previous commit on main), written only by
      # .github/workflows/next-build-cache.yml (rules: scripts/test_ci_next_cache.py). The build below
      # still type-checks every file; TypeScript only skips re-checking files whose content and whose
      # dependencies' types are unchanged since that build. No record, or a slow download: a cold build.
      - name: Base commit of this tree
        id: base
        run: |
          base=$(git cat-file -p HEAD 2>/dev/null | sed -n '/^$/q;s/^parent //p' | head -n 1) || base=none
          case "$base" in *[!0-9a-f]*|"") base=none ;; esac
          [ "${#base}" -eq 40 ] || base=none
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Restore TypeScript build record of the base commit
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
        with:
          path: .next/cache/.tsbuildinfo
          key: next-tsbuildinfo-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ steps.base.outputs.sha }}
      - run: node scripts/ci-build.mjs
      - name: Pack the build with the tree it was made from
        run: node scripts/ci-next-artifact.mjs pack
      - name: Share the build with this run's browser jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next-build
          path: next-build.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  studio-matrix:
    needs: [build, documentation-scope]
    if: ${{ !cancelled() && needs.documentation-scope.outputs.full != 'false' && needs.build.result == 'success' }}
    name: Studio AAA (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # Match the exact playwright-core package; browsers and OS libraries are preinstalled.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --init --ipc=host --user pwuser
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      # New AX2 cases stay off for private/unknown repositories; existing cases remain.
      AX2_PUBLIC_STANDARD: ${{ (github.repository_id == '1334793724' || github.repository == 'viniciussucupira/marktmorgen') && github.event.repository.private == false && github.event.repository.visibility == 'public' }}
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify the package matches the preinstalled browser image
        run: node -e "if (require('playwright-core/package.json').version !== '1.56.1') process.exit(1)"
      - name: Deals board focus, confirmed removal, Move only on its button, errors tied to fields and one status region (synthetic, no server)
        run: node tests/e2e/deals-board-focus.mjs
      - name: Page editor arrows keep focus at an edge, moves and removals said, no icon button animated in forced colors (synthetic, no server)
        run: node tests/e2e/page-editor-actions.mjs
      - name: Download this run's production build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-build
          path: ${{ runner.temp }}/next-build
      - name: Use the production build only if it was made from this exact tree
        run: node scripts/ci-next-artifact.mjs unpack "$RUNNER_TEMP/next-build/next-build.tar.gz"
      - name: Authenticated studio and page editor at five widths with AAA and access modes
        run: node tests/e2e/accessibility-studio-matrix.mjs

  all-checks:
    # The one check GitHub requires before main (scripts/ci_all_checks.py): it always runs and
    # passes only when every job above passed, or was skipped for a documentation-only change.
    name: All checks (accessibility-studio-matrix)
    needs: [build, documentation-scope, studio-matrix]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read every job's result; a skip counts only for a documentation-only change
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 scripts/test_ci_all_checks.py
          python3 scripts/ci_all_checks.py
