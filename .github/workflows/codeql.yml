# 508 [SG4] part 1: CodeQL code scanning, free for a public repository.
# Runs on every pull request, on main and once a day. It reads the code and
# uploads its findings to the repository's code scanning; it changes nothing,
# merges nothing and needs no secret. Actions are pinned to full commit SHAs
# at least two weeks old (github/codeql-action v4.38.3, 8 October 2026;
# actions/upload-artifact v7.0.2 and actions/download-artifact v8.0.2, 7 October 2026).
# The JavaScript/TypeScript queries run split into parallel parts (analyze-part) and are
# uploaded merged by analyze: same languages, same security-extended suite, same code.
name: CodeQL
run-name: PV8 source ${{ github.sha }}
on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
  actions: read
concurrency:
  group: codeql-${{ github.ref }}-${{ github.event_name }}
  # A merge group's ref is its own (gh-readonly-queue/main/pr-N-…), so with the event in
  # the group a merge group never shares one with a pull request run or another merge group.
  # The active merge-group run is never canceled by this group; a newer delivery of the same
  # merge group may replace one still pending, and that replacement is the same check.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
jobs:
  documentation-scope:
    name: Documentation scope (codeql)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test conservative documentation classification
        run: |
          python3 scripts/test_ci_documentation_scope.py
          python3 scripts/test_ci_full_tree_proof.py
      - name: Compare actual PR trees; uncertainty keeps full coverage
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_TOKEN: ${{ github.token }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_documentation_scope.py
  analyze-part:
    # The JavaScript/TypeScript analysis of the full security-extended suite, split into
    # parts that run side by side (scripts/codeql_query_parts.py): the same queries on the
    # same code, each query in exactly one part. A part never uploads by itself; `analyze`
    # checks the parts and uploads them merged as the one analysis code scanning knew.
    needs: documentation-scope
    if: ${{ !cancelled() && needs.documentation-scope.outputs.full != 'false' }}
    name: CodeQL (javascript-typescript, part ${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Choose this part's queries from the full suite
        id: part
        run: python3 scripts/codeql_query_parts.py config ${{ matrix.part }} >> "$GITHUB_OUTPUT"
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          build-mode: none
          config: ${{ steps.part.outputs.config }}
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:javascript-typescript
          upload: never
          output: ${{ runner.temp }}/codeql-part
      - name: Name this part's results
        run: mv "$RUNNER_TEMP/codeql-part/javascript.sarif" "$RUNNER_TEMP/codeql-part/javascript-part-${{ matrix.part }}.sarif"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-javascript-part-${{ matrix.part }}
          path: ${{ runner.temp }}/codeql-part/javascript-part-${{ matrix.part }}.sarif
          if-no-files-found: error
          retention-days: 5
      - name: Keep the query evaluator logs of the last part (where evaluation time goes)
        if: matrix.part == 4
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-javascript-evaluator-logs
          path: ${{ runner.temp }}/codeql_databases/javascript/log
          if-no-files-found: warn
          retention-days: 5
  analyze:
    # Same job and matrix as the single-job analysis before, so code scanning keeps the same
    # two configurations: actions is analyzed here; javascript-typescript uploads the parts
    # above merged into one analysis, only when every part succeeded and all queries are there.
    needs: [documentation-scope, analyze-part]
    if: ${{ !cancelled() && needs.documentation-scope.outputs.full != 'false' }}
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: matrix.language == 'actions'
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: actions
          build-mode: none
          queries: security-extended
      - if: matrix.language == 'actions'
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:actions
      - name: Every part succeeded; a failed, canceled or skipped part uploads nothing
        if: matrix.language == 'javascript-typescript'
        env:
          PARTS_RESULT: ${{ needs.analyze-part.result }}
        run: |
          echo "analyze-part: $PARTS_RESULT"
          test "$PARTS_RESULT" = success
      - if: matrix.language == 'javascript-typescript'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: codeql-javascript-part-*
          path: ${{ runner.temp }}/codeql-parts
          merge-multiple: true
      - name: Every query of the suite ran in exactly one part
        if: matrix.language == 'javascript-typescript'
        run: |
          python3 scripts/test_codeql_query_parts.py
          python3 scripts/codeql_query_parts.py check "$RUNNER_TEMP/codeql-parts"
      - if: matrix.language == 'javascript-typescript'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/codeql-parts
          category: /language:javascript-typescript

  all-checks:
    # The one check GitHub requires before main (scripts/ci_all_checks.py): it always runs and
    # passes only when every job above passed, or was skipped for a documentation-only change.
    name: All checks (codeql)
    needs: [analyze, analyze-part, documentation-scope]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read every job's result; a skip counts only for a documentation-only change
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 scripts/test_ci_all_checks.py
          python3 scripts/ci_all_checks.py
