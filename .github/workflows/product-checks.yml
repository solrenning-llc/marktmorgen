name: Product checks
run-name: PV8 source ${{ github.sha }}
on:
  schedule:
    - cron: '37 5 * * *'
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
  actions: read
concurrency:
  group: product-checks-${{ github.ref }}-${{ github.event_name }}
  # A merge group's ref is its own (gh-readonly-queue/main/pr-N-…), so with the event in
  # the group a merge group never shares one with a pull request run or another merge group.
  # The active merge-group run is never canceled by this group; a newer delivery of the same
  # merge group may replace one still pending, and that replacement is the same check.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
jobs:
  documentation-scope:
    name: Documentation scope (product-checks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test public repository data detector
        run: python3 scripts/test_public_data.py
      - name: Reject personal data without printing matched values
        run: python3 scripts/check_public_data.py
      - name: Test conservative documentation classification
        run: |
          python3 scripts/test_ci_documentation_scope.py
          python3 scripts/test_ci_full_tree_proof.py
      - name: Compare actual PR trees; uncertainty keeps full coverage
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_TOKEN: ${{ github.token }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_documentation_scope.py
  build:
    needs: documentation-scope
    if: ${{ !cancelled() && needs.documentation-scope.outputs.full != 'false' }}
    # The production build, once per run instead of once in every browser job. The jobs that
    # start it download this one; scripts/ci-next-artifact.mjs refuses a build of another tree,
    # Node major, platform or architecture. Same image, user and Node as those jobs.
    name: Next build (product-checks)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --init --ipc=host --user pwuser
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node scripts/ci-build.mjs
      - name: Pack the build with the tree it was made from
        run: node scripts/ci-next-artifact.mjs pack
      - name: Share the build with this run's browser jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: next-build
          path: next-build.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  verify:
    needs: documentation-scope
    if: ${{ !cancelled() && needs.documentation-scope.outputs.full != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AX2_KEYBOARD_PUBLIC_STANDARD: ${{ (github.repository_id == '1334793724' || github.repository == 'viniciussucupira/marktmorgen') && github.event.repository.private == false && github.event.repository.visibility == 'public' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Behavior regressions
        run: npm test
      - name: Production build and route types
        run: node scripts/ci-build.mjs
      - name: Verify reviewed development dependencies stay outside runtime
        run: python3 scripts/check_dependency_runtime.py .next
      # The signing flow in a real browser (the runner's own Chrome through playwright-core: no browser is downloaded),
      # on the build above, against the stand-in database and email sender of tests/e2e/services.mjs.
      - name: Agreements signed with a link, in a browser
        run: node tests/e2e/agreements.mjs --no-build
      - name: Copying a whole store, in a browser
        run: node tests/e2e/store-copy.mjs --no-build

  form-opportunity-redis:
    needs: documentation-scope
    if: ${{ !cancelled() && needs.documentation-scope.outputs.full != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - "16379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Actual Redis Lua conversion checks
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_form_opportunity_redis.py
      - name: Actual Redis bounded retained dispute record checks
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_dispute_preorder_redis.py
      - name: Actual Redis CRM pipelines compare-and-set checks
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_crm_pipelines_redis.py
      - name: Actual Redis funnel capacity and address checks
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_funnel_capacity_redis.py
      - name: Actual Redis funnel share link and saved section checks
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_funnel_share_redis.py
      - name: Actual Redis monthly upload admission checks
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_upload_budget_redis.py
      - name: Actual Redis AI spending admission checks
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_ai_spend_redis.py
      - name: Actual Redis automatic spend ledger opening checks
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_spend_ledger_open_redis.py
      - name: Actual Redis company exposure reservation checks
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_exposure_budget_redis.py
      - name: Actual Redis full contract cash reservation checks
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_contract_funding_redis.py
      - name: Actual Redis host claim checks for team scheduling
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_host_claims_redis.py
      # Deleting a person runs the application's own code against Redis, so it needs the dependencies.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          # Cache egress exhausted the account and consumed this bounded job.
          # Install from the lockfile without a cache restore or save here.
          package-manager-cache: false
      - run: npm ci
      - name: Actual Redis order admission checks
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_order_admission_redis.py
      - name: Actual Redis durable shipment dispatch checks
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_shipment_mail_outbox_redis.py
      - name: Actual Redis original-window order settlement checks
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_order_confirmation_checkpoint_redis.py
      - name: Actual Redis protected pre-payment confirmation origin checks
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_order_confirmation_outbox_redis.py
      - name: Actual Redis global fallback ownership and clock checks
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_resend_fallback_budget_redis.py --port 16379
      - name: Synthetic self-hosted HTTP to actual Redis contract
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_self_hosted_redis_http.py
      - name: Synthetic encrypted codec to actual binary Redis restore
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_self_hosted_backup_redis.py
      - name: Synthetic two-server Redis migration and private DNS rollback
        if: ${{ (github.repository_id == '1334793724' || github.repository == 'viniciussucupira/marktmorgen') && github.event.repository.private == false && github.event.repository.visibility == 'public' }}
        timeout-minutes: 4
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
          SV4_STANDARD_PUBLIC_CI: "true"
        run: python3 scripts/test_self_hosted_redis_migration.py
      - name: Actual Redis security checks (docs/security-audit-2026-10-18.md)
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_security_redis.py
      - name: Actual Redis person deletion checks
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_contact_erasure_redis.py
      - name: Actual Redis closed store deletion checks
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_closed_store_redis.py
      - name: Actual Redis data room checks
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_store_data_redis.py
      - name: Actual Redis Path record and data-room atomic checks
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_path_atomic_redis.py
      - name: Actual Redis capped count checks
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_capped_count_redis.py
      - name: Actual Redis order records checks
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_order_data_redis.py
      - name: Actual Redis one-time recount checks
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_data_recount_redis.py
      - name: Actual Redis Store assistant pool checks
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_assistant_pool_redis.py
      - name: Actual Redis atomic experiment sale checks
        env:
          MARKTMORGEN_REDIS_INTEGRATION: "1"
        run: python3 scripts/test_experiment_sale_redis.py

  mobile-render:
    needs: [build, documentation-scope]
    if: ${{ !cancelled() && needs.documentation-scope.outputs.full != 'false' && needs.build.result == 'success' }}
    name: Mobile render (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: candidate
            ref: ${{ github.sha }}
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      MOBILE_RENDER_LABEL: ${{ matrix.label }}
      MOBILE_RENDER_SHA: ${{ matrix.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.ref }}
          path: measured-app
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: measured-app/package-lock.json
      - run: npm ci
        working-directory: measured-app
      - name: Download this run's production build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-build
          path: ${{ runner.temp }}/next-build
      - name: Use the production build only if it was made from this exact tree
        working-directory: measured-app
        run: node scripts/ci-next-artifact.mjs unpack "$RUNNER_TEMP/next-build/next-build.tar.gz"
      - name: Measure cold mobile rendering against the same local production server
        run: node tests/e2e/mobile-render.mjs measured-app

  cross-browser:
    needs: [build, documentation-scope]
    if: ${{ !cancelled() && needs.documentation-scope.outputs.full != 'false' && needs.build.result == 'success' }}
    name: Cross-browser (${{ matrix.browser }})
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --init --ipc=host --user pwuser
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_BROWSER: ${{ matrix.browser }}
      AX2_KEYBOARD_PUBLIC_STANDARD: ${{ (github.repository_id == '1334793724' || github.repository == 'viniciussucupira/marktmorgen') && github.event.repository.private == false && github.event.repository.visibility == 'public' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify the package matches the preinstalled browser image
        run: node -e "if (require('playwright-core/package.json').version !== '1.56.1') process.exit(1)"
      - name: Download this run's production build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: next-build
          path: ${{ runner.temp }}/next-build
      - name: Use the production build only if it was made from this exact tree
        run: node scripts/ci-next-artifact.mjs unpack "$RUNNER_TEMP/next-build/next-build.tar.gz"
      - name: Existing complete studio and public-page browser regressions with synthetic services
        run: node tests/e2e/store-copy.mjs --no-build

  all-checks:
    # The one check GitHub requires before main (scripts/ci_all_checks.py): it always runs and
    # passes only when every job above passed, or was skipped for a documentation-only change.
    name: All checks (product-checks)
    needs: [build, cross-browser, documentation-scope, form-opportunity-redis, mobile-render, verify]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read every job's result; a skip counts only for a documentation-only change
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 scripts/test_ci_all_checks.py
          python3 scripts/ci_all_checks.py
