# PV (AGENTS.md): the daily report of aging pull requests. Reads every open, non-draft pull request
# and updates the body of ONE issue labeled prs-parados. It never closes, comments on, labels or
# merges a pull request: pull requests, commits and checks are only read (GET), and the only writes
# are the label and the report issue. Not a required check and not part of CI: it has no final
# check and runs only on its schedule or by hand (scripts/stale_pr_report.mjs,
# tests/stale-pr-report.test.ts). checks: read is there only to read the nine required final
# check results of each head.
#
# The same workflow runs, every hour but the daily report's, the queue-health report (C1-20261109-
# 1332-TODOS-60, scripts/queue_health_report.mjs, tests/queue-health-report.test.ts): read-only too,
# it writes ONE issue labeled fila-doente, and closes it when there is nothing to warn about. Its job
# has its own permission block, with actions read only to read runs and jobs, and no checks read. GITHUB_TOKEN
# allows 1,000 requests an hour per repository, shared by every workflow here, so skipping the daily
# report's hour does not keep the two apart; the health report keeps its own reads small (see the
# script). GitHub-hosted standard runners are free in public repositories (github/docs, content/
# billing/concepts/product-billing/github-actions.md, as Claude 6 read it on 9 November 2026).
name: Stale PR report
on:
  schedule:
    - cron: '17 11 * * *'
    - cron: '43 0-10,12-23 * * *'
  workflow_dispatch:
    inputs:
      report:
        description: Which report to run
        type: choice
        options: [daily, health]
        default: daily
permissions:
  contents: read
  pull-requests: read
  checks: read
  issues: write
concurrency:
  group: stale-pr-report
  cancel-in-progress: false
jobs:
  report:
    name: Stale PR report
    if: ${{ github.event.schedule == '17 11 * * *' || (github.event_name == 'workflow_dispatch' && inputs.report != 'health') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/stale_pr_report.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Read the open pull requests and update the report issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/stale_pr_report.mjs
  health:
    name: Queue health report
    if: ${{ github.event.schedule == '43 0-10,12-23 * * *' || (github.event_name == 'workflow_dispatch' && inputs.report == 'health') }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/queue_health_report.mjs
            .github/workflows/codeql.yml
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Read the queue's health and update the fila-doente issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/queue_health_report.mjs
