<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font:16px/1.5 sans-serif}

.sp-countdown-units{display:flex;justify-content:center;gap:.625rem}
.text-sm{font-size:.875rem}

</style></head><body>
<main id="content" class="st-measure">
 <div class="sp-countdown" id="cd">

 </div>
 <ul id="bundle"><li class="row" id="item"><a>Sourdough Guide</a><span id="price">$29 on its own</span></li></ul>
